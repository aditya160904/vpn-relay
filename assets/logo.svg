<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0E1B2A"/>
  
  <!-- Shield outline - offset slightly left for asymmetric composition -->
  <path d="M 112 38 L 176 66 L 176 132 C 176 164 148 186 112 202 C 76 186 48 164 48 132 L 48 66 Z" 
        fill="none" stroke="#E8F1F8" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Inner shield accent line -->
  <path d="M 112 50 L 164 74 L 164 130 C 164 156 142 174 112 188 C 82 174 60 156 60 130 L 60 74 Z" 
        fill="none" stroke="#7FB3D5" stroke-width="2.5" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Relay tower - vertical mast through shield center -->
  <line x1="112" y1="76" x2="112" y2="172" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Tower base - small platform -->
  <line x1="92" y1="172" x2="132" y2="172" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Tower top node / antenna -->
  <circle cx="112" cy="76" r="6" fill="#3DDC97"/>
  
  <!-- Signal arcs passing through shield - left side -->
  <path d="M 80 100 Q 66 112 80 124" fill="none" stroke="#7FB3D5" stroke-width="4" stroke-linecap="round"/>
  <path d="M 70 86 Q 48 112 70 138" fill="none" stroke="#7FB3D5" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Signal arcs passing through shield - right side -->
  <path d="M 144 100 Q 158 112 144 124" fill="none" stroke="#7FB3D5" stroke-width="4" stroke-linecap="round"/>
  <path d="M 154 86 Q 176 112 154 138" fill="none" stroke="#7FB3D5" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Outer signal arcs extending beyond shield edges (subtle) -->
  <path d="M 62 72 Q 36 112 62 152" fill="none" stroke="#7FB3D5" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 162 72 Q 188 112 162 152" fill="none" stroke="#7FB3D5" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  
  <!-- Relay connection crossbar mid-tower -->
  <line x1="94" y1="124" x2="130" y2="124" stroke="#E8F1F8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small relay indicator dots on crossbar -->
  <circle cx="94" cy="124" r="3" fill="#3DDC97"/>
  <circle cx="130" cy="124" r="3" fill="#3DDC97"/>
</svg>
